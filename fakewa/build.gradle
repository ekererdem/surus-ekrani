// Sadece emülatör testi için: "WhatsApp" adıyla mesaj bildirimi gönderen küçük uygulama.
// Gerçek uygulamaya (app) girmez; build.yml sadece :app derler.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whatsapp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.whatsapp'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
