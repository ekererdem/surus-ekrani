name: Emülatörde dene

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Derle
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon > build.log 2>&1; then
            echo "::error::$(grep -A8 -E 'error:|What went wrong|FAILED' build.log | grep -v '^> Task.*UP-TO-DATE' | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r fakewa/build/outputs/apk/debug/fakewa-debug.apk || true
            adb logcat -c
            adb root ; sleep 3 ; adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 4 ; adb shell am force-stop com.erdem.surusekrani ; sleep 2
            adb shell "mkdir -p /data/data/com.erdem.surusekrani/shared_prefs && rm -f /data/data/com.erdem.surusekrani/shared_prefs/surus.xml.bak && echo '<?xml version=\"1.0\" encoding=\"utf-8\"?><map><boolean name=\"autoSplit\" value=\"false\" /><boolean name=\"onboarded\" value=\"true\" /><string name=\"call1Name\">Ahmet</string><string name=\"call1Num\">05551112233</string><string name=\"parkCoord\">39.9208,32.8541</string><long name=\"parkAt\" value=\"1792250000000\" /><string name=\"parkNote\">B2 katı, 47 numara</string><string name=\"favApps\">com.android.settings/com.android.settings.Settings|com.google.android.apps.maps/com.google.android.maps.MapsActivity|com.android.chrome/com.google.android.apps.chrome.Main|com.android.camera2/com.android.camera.CameraLauncher|com.android.contacts/com.android.contacts.activities.PeopleActivity</string><string name=\"call2Name\">Ayşe</string><string name=\"call2Num\">05552223344</string><string name=\"place1Name\">Ev</string><string name=\"place1Coord\">39.9,32.8</string><string name=\"place1Icon\">home</string></map>' > /data/data/com.erdem.surusekrani/shared_prefs/surus.xml"
            adb shell cmd notification allow_listener com.erdem.surusekrani/com.erdem.surusekrani.MediaListener || true
            adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 15
            adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 5
            adb shell cmd notification post -c msg -t Annem testtag 'Nerdesiniz ne zaman geleceksiniz' || true ; sleep 2
            sleep 1 ; adb shell uiautomator dump /sdcard/u.xml > dump.txt 2>&1 ; adb shell cat /sdcard/u.xml > ui.xml 2>&1 || true
            adb exec-out screencap -p > shot-main.png || true
            python3 .github/park_test.py || true
            python3 .github/notif_test.py || true
            python3 .github/weather_test.py || true
            adb shell am broadcast -n com.erdem.surusekrani/.BtReceiver -a com.erdem.surusekrani.BT_OFF || true ; sleep 2
            adb root ; sleep 3 ; adb shell am start -n com.erdem.surusekrani/.SettingsActivity ; sleep 6
            adb exec-out screencap -p > shot-settings.png || true
            adb shell input swipe 160 560 160 60 300 ; sleep 1 ; adb shell input swipe 160 560 160 60 300 ; sleep 2 ; adb exec-out screencap -p > shot-settings-alt.png || true
            adb shell am start -n com.erdem.surusekrani/.FeaturesActivity ; sleep 4 ; adb shell am start -n com.erdem.surusekrani/.OnboardingActivity ; sleep 4
            adb exec-out screencap -p > shot-onboarding.png || true
            adb shell uiautomator dump /sdcard/u2.xml ; adb shell cat /sdcard/u2.xml > ui2.xml || true
            python3 .github/drag_test.py || true
            adb shell input keyevent KEYCODE_HOME ; sleep 3 ; adb shell input swipe 160 600 160 120 400 ; sleep 3 ; adb exec-out screencap -p > shot-drawer.png || true
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' | grep -A40 -i 'FATAL\|AndroidRuntime' > err.txt || true
            cat crash.txt err.txt
      - name: Rapor
        if: always()
        run: |
          f=crash.txt; [ -s crash.txt ] || f=err.txt
          if [ -s "$f" ]; then echo "::error::$(grep -v '^-' $f | head -45 | sed ':a;N;$!ba;s/\n/%0A/g')"; else echo "::notice::Çökme yok"; fi
      - name: Düğme yerleri
        if: always()
        run: |
          echo "::notice::dump: $(cat dump.txt 2>/dev/null | tr '\n' ' ') size: $(wc -c < ui.xml 2>/dev/null)"
          [ -f ui.xml ] || exit 0
          python3 - <<'PY'
          import re
          x=open('ui.xml').read()
          out=[]
          for m in re.finditer(r'resource-id="com\.erdem\.surusekrani:id/(\w+)"[^>]*?bounds="([^"]+)"', x):
              if m.group(1) in ('statusTile','weatherTile','parkBtn','assistBtn','settingsBtn','iconsRow1','iconsRow2','call1Btn','notifTile'):
                  out.append(m.group(1)+' '+m.group(2))
          pk=sorted(set(re.findall(r'package="([^"]+)"', x)))
          txt=re.findall(r'text="([^"]+)"', x)[:15]
          print('::notice::pk='+','.join(pk)+' txt='+'/'.join(txt)+' btn='+' | '.join(out))
          PY
      - name: Sürükleme
        if: always()
        run: |
          echo "::notice::drag $(cat drag.txt 2>/dev/null)"
          echo "::notice::park $(cat park.txt 2>/dev/null)"
          echo "::notice::notif $(cat notif.txt 2>/dev/null)"
          echo "::notice::hava $(cat weather.txt 2>/dev/null)"
      - name: Ayarlar düzeni
        if: always()
        run: |
          [ -f ui2.xml ] || exit 0
          python3 - <<'PY'
          import re
          x=open('ui2.xml').read()
          cb=re.findall(r'text="([^"]+)"[^>]*class="android.widget.CheckBox"[^>]*checked="(\w+)"', x)
          rows=[t for t in re.findall(r'text="([^"]+)"', x) if t.replace('&#10;',' ') in ('Üst sıra','Alt sıra')]
          print('::notice::cb='+str(cb)+' rows='+str(rows))
          PY
      - name: Ekran görüntülerini "shots" dalına kaydet
        if: always()
        run: |
          ls shot-*.png 2>/dev/null || exit 0
          mkdir /tmp/shots && cp shot-*.png /tmp/shots/
          git config user.name "smoke" && git config user.email "smoke@users.noreply.github.com"
          git checkout --orphan shots && git rm -rfq . && git clean -fdq
          cp /tmp/shots/*.png . && git add *.png && git commit -qm "ekran görüntüleri" && git push -fq origin shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: |
            crash.txt
            err.txt
            shot-*.png
