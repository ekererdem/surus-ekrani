name: Emülatörde dene

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Derle
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 15
            adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 5
            adb shell uiautomator dump /sdcard/u.xml ; adb pull /sdcard/u.xml ui.xml || true
            adb root ; sleep 3 ; adb shell am start -n com.erdem.surusekrani/.SettingsActivity ; sleep 6
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' | grep -A40 -i 'FATAL\|AndroidRuntime' > err.txt || true
            cat crash.txt err.txt
      - name: Rapor
        if: always()
        run: |
          f=crash.txt; [ -s crash.txt ] || f=err.txt
          if [ -s "$f" ]; then echo "::error::$(grep -v '^-' $f | head -45 | sed ':a;N;$!ba;s/\n/%0A/g')"; else echo "::notice::Çökme yok"; fi
      - name: Düğme yerleri
        if: always()
        run: |
          [ -f ui.xml ] || exit 0
          python3 - <<'PY'
          import re
          x=open('ui.xml').read()
          out=[]
          for m in re.finditer(r'resource-id="com\.erdem\.surusekrani:id/(\w+)"[^>]*?bounds="([^"]+)"', x):
              if m.group(1) in ('statusTile','weatherTile','parkBtn','assistBtn','settingsBtn','iconsRow1','iconsRow2','call1Btn'):
                  out.append(m.group(1)+' '+m.group(2))
          print('::notice::'+' | '.join(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: |
            crash.txt
            err.txt
