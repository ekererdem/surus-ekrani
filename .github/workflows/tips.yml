name: İpucu görüntüleri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > build.log 2>&1 || (tail -40 build.log; exit 1)
      - name: Ekran görüntüleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r fakewa/build/outputs/apk/debug/fakewa-debug.apk || true
            adb root ; sleep 3 ; adb shell am start -n com.erdem.surusekrani/.MainActivity ; sleep 5 ; adb shell am force-stop com.erdem.surusekrani ; sleep 2
            python3 .github/tips_shots.py || true
      - name: "tips-shots dalına kaydet"
        if: always()
        run: |
          ls tips-* 2>/dev/null || exit 0
          mkdir /tmp/t && cp tips-* /tmp/t/
          git config user.name "smoke" && git config user.email "smoke@users.noreply.github.com"
          git checkout --orphan tips-shots && git rm -rfq . && git clean -fdq
          cp /tmp/t/* . && git add tips-* && git commit -qm "ipucu görüntüleri" && git push -fq origin tips-shots
