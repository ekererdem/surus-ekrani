name: APK derle

on:
  push:
    branches: [main]
    # Sadece README ya da ekran görüntüsü değişince APK'yı yeniden derleme
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki derleme sürümü birbirine karıştırmasın
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SurusEkrani.apk

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=repos/${{ github.repository }}/releases
          # Uygulamanın "güncelleme var mı" kontrolü bu satırdan sürümü okur
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          NOTES="Sürüm $VN ($VC) · Son derleme: $GITHUB_SHA"
          # Eskiden sürüm silinip etiketiyle yeniden kuruluyordu; GitHub eski etiketi geç silince yeni sürüm
          # taslağa düşüyor ve indirme linki bozuluyordu. Artık sürüm silinmez, sadece APK değiştirilir.
          for id in $(gh api $R --jq '.[] | select(.draft) | .id'); do gh api -X DELETE $R/$id || true; done
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh api $R/tags/latest >/dev/null 2>&1; then
            gh release create latest --title "Kopilot" --notes "$NOTES" --verify-tag
          fi
          gh release upload latest SurusEkrani.apk --clobber
          gh release edit latest --draft=false --latest --title "Kopilot" --notes "$NOTES"
          for i in 1 2 3 4 5 6; do
            sleep 5
            if gh api $R/tags/latest --jq '.assets[] | select(.name=="SurusEkrani.apk") | .state' | grep -q uploaded; then
              echo "Yayında"; exit 0
            fi
            gh release edit latest --draft=false --latest || true
          done
          echo "::error::Sürüm yayınlanamadı"
          exit 1
