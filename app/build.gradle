plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erdem.surusekrani'
    compileSdk 35

    defaultConfig {
        applicationId 'com.erdem.surusekrani'
        minSdk 30
        targetSdk 34
        versionCode 124
        versionName '13.3'
        // Google Haritalar anahtarı: GitHub'da gizli ayar (MAPS_API_KEY), kodda durmaz.
        manifestPlaceholders = [mapsKey: (System.getenv('MAPS_API_KEY') ?: (project.findProperty('MAPS_API_KEY') ?: ''))]
    }

    // Sabit imza: her derleme aynı anahtarla imzalanır, böylece yeni sürüm eskisinin üzerine kurulur.
    signingConfigs {
        debug {
            storeFile file('surus.keystore')
            storePassword 'surus123'
            keyAlias 'surus'
            keyPassword 'surus123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
}
